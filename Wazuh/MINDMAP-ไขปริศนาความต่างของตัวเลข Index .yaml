🧠 MINDMAP: ไขปริศนาความต่างของตัวเลข Index (1 vs 0)

=======================================================
 1️⃣ ฝั่งต้นทาง: ระบบปฏิบัติการ (Linux Kernel)
=======================================================
 ภายในฟังก์ชัน `security_socket_connect` ของ OS จะมีตัวแปรเตรียมไว้ให้ 2 ตัว:
   │
   ├─ ตำแหน่งที่ 0: `sock`     (ข้อมูล Socket ทั่วไป) ❌ เราไม่ได้ใช้
   │
   └─ ตำแหน่งที่ 1: `sockaddr` (ข้อมูล IP และ Port)   ✅ นี่คือสิ่งที่เราต้องการ!
         │
         │
=======================================================
 2️⃣ ฝั่งคนกลาง: ไฟล์ตั้งค่า Tetragon (YAML Script)
=======================================================
 เราเขียนคำสั่ง (Rule) สั่งให้ Tetragon ไปล้วงข้อมูลมา:
   │
   ├─ คำสั่ง: `index: 1` 
   │  (ความหมาย: "Tetragon เอ๋ย... จงไปหยิบข้อมูลตำแหน่งที่ 1 จาก Kernel มาให้ที!")
   │
   └─ การกระทำ: Tetragon หยิบ `sockaddr` มาได้แค่ 1 ชิ้นถ้วน แล้วจับใส่ "กล่องพัสดุ"
         │
         │
=======================================================
 3️⃣ ฝั่งปลายทาง: ผลลัพธ์บนหน้าจอ (JSON Log / Wazuh)
=======================================================
 Tetragon ส่งกล่องพัสดุที่ชื่อว่า `args` (Array) มาให้ Wazuh เปิดดู:
   │
   ├─ กฎของคอมพิวเตอร์: "ของชิ้นแรกในกล่อง (Array) ต้องเริ่มนับที่เลข 0 เสมอ!"
   │
   └─ หน้าตา Log ที่ออกมา:
        ▼ args (กล่องพัสดุ)
            ▼ 0 (ของชิ้นแรกและชิ้นเดียวในกล่อง) 
                ▼ sockaddr_arg (ข้อมูล IP/Port)
                     addr: 172.24.0.3
                     port: 3306
